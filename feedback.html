<script>(function(){try{var d=document.documentElement,t=localStorage.getItem("theme");var light=(t==="light")||(!t&&!window.matchMedia("(prefers-color-scheme: dark)").matches);var custom=(t==="custom");if(custom){d.classList.add("custom");d.style.colorScheme="dark";var s=localStorage.getItem("themeCustom:vars")||"";s.split("\n").forEach(function(l){var i=l.indexOf(":");if(i<1)return;var n=l.slice(0,i),v=l.slice(i+1);if(!/^--[a-z0-9-]+$/i.test(n))return;if(/["'<>`]/.test(v))return;d.style.setProperty(n,v);});}else if(light){d.classList.add("light-mode");}else if(t==="glass"){d.classList.add("glass");}d.style.colorScheme=(light&&!custom)?"light":"dark";}catch(e){}})();</script>
<script>(function(){try{var v=localStorage.getItem('vid');if(!v){v='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('vid',v);}var b=jssjApiBase();fetch(b+'/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vid:v,page:location.pathname}),keepalive:true}).catch(function(){});}catch(e){}})();</script>

<div class="app">
  <header class="navbar">
    <div class="navbar-left">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="打开目录" aria-controls="sidebar" aria-expanded="false"><i class="fas fa-bars"></i></button>
      <a class="server-name" href="index.html">建设世界</a>
    </div>
    <div class="navbar-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
    </div>
  </header><main class="main-content" id="main">
    <div class="page-container">
      <div id="feedbackPage" class="page-stack">
        <div class="server-header">
          <h2><i class="fas fa-comment-medical"></i> 问题反馈</h2>
        </div>

        <div class="card">
          <h2>📝 提交反馈</h2>
          <form id="fbForm" novalidate>
            <div class="form-group">
              <label id="fbCatLabel">问题类型</label>
              <div class="fb-cats" role="radiogroup" aria-labelledby="fbCatLabel">
                <input type="radio" name="fbCat" id="cat-bug" value="bug" checked>
                <label for="cat-bug"><i class="fas fa-bug"></i> 功能异常 / Bug</label>
                <input type="radio" name="fbCat" id="cat-suggest" value="suggest">
                <label for="cat-suggest"><i class="fas fa-lightbulb"></i> 建议 / 新功能</label>
                <input type="radio" name="fbCat" id="cat-abuse" value="abuse">
                <label for="cat-abuse"><i class="fas fa-user-shield"></i> 举报违规</label>
                <input type="radio" name="fbCat" id="cat-other" value="other">
                <label for="cat-other"><i class="fas fa-ellipsis-h"></i> 其他</label>
              </div>
            </div>

            <div class="form-group">
              <label for="fbContent">问题描述 <span aria-hidden="true">*</span></label>
              <textarea id="fbContent" rows="6" maxlength="2000" required
                placeholder="请尽量写清：在哪个页面、做了什么操作、看到的现象、期望的结果。&#10;例：手机上打开神人榜，长截图只显示上半部分，希望能看全图。"></textarea>
              <div class="fb-counter">
                <span>写得越具体，越好排查（不要只写「坏了」）</span>
                <span><span id="fbCount">0</span> / 2000</span>
              </div>
            </div>

            <div class="form-group">
              <label for="fbImages">配图（可选，最多 3 张，每张不超过 5MB）</label>
              <label class="fb-drop" for="fbImages">
                <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
                <span>点击选择图片 / 截图</span>
              </label>
              <input type="file" id="fbImages" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" multiple hidden>
              <div class="fb-thumbs" id="fbThumbs"></div>
              <div class="row-note" id="fbImgNote" hidden></div>
            </div>

            <div class="form-group">
              <label for="fbContact">联系方式（可选）</label>
              <input type="text" id="fbContact" maxlength="100" placeholder="QQ / 游戏 ID / 邮箱，方便我们联系你核实">
              <div class="row-note">留了联系方式，回复能直接找到你；不留也可以，凭下方「查询凭证」看进度。</div>
            </div>

            <div class="fb-actions">
              <button type="submit" class="btn btn-primary" id="fbSubmit">
                <i class="fas fa-paper-plane" aria-hidden="true"></i> 提交反馈
              </button>
              <button type="button" class="btn btn-ghost" id="fbReset">
                <i class="fas fa-eraser" aria-hidden="true"></i> 清空
              </button>
            </div>
          </form>

          <div id="fbResult" hidden></div>
        </div>

        <div class="card">
          <h2>📬 我的反馈</h2>
          <div id="fbMine">
            <div class="empty-state state-loading"><span class="spinner" aria-hidden="true"></span></div>
          </div>
        </div>

        <div class="note">
          <i class="fas fa-circle-info" aria-hidden="true"></i>
          <div>
            提交时会记录你的 IP 与浏览器信息，仅用于防刷和定位问题；不会公开。请勿提交密码、身份证等敏感信息。<br>
            服务器内的问题也可以直接在 QQ 群里找管理，这个页面适合反馈「网站上看到的问题」。
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="footer-copy">© 2077 建设世界. 并不保留所有权利。</div>
