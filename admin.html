    (function () {
      var errs = [];
      function paint() {
        var box = document.getElementById('__bootErr');
        if (!box) {
          box = document.createElement('div');
          box.id = '__bootErr';
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#3b1113;color:#ffd7d5;' +
            'border:2px solid #ef6a63;border-radius:10px;padding:12px 14px;font:13px/1.7 ui-monospace,monospace;' +
            'white-space:pre-wrap;max-height:45vh;overflow:auto';
          document.body.appendChild(box);
        }
        box.textContent = '后台没能启动，把下面这段发给我就能定位：\n' + errs.join('\n');
      }
      window.addEventListener(
        'error',
        function (e) {
          var t = e && e.target;
          errs.push('[error] ' + (e.message || (t && (t.src || t.href)) || '未知错误'));
          paint();
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (e) {
        errs.push('[promise] ' + ((e.reason && (e.reason.message || e.reason)) || '未知'));
        paint();
      });
      window.setTimeout(function () {
        /* ⚠️ 判据必须用**真实存在的**标记：登录态是 `.auth-box-wrap` + `input[type=password]`，
         *   登录后是 `.admin`。曾经误判成 `#authOverlay`（那是旧站的 id，新站没有），
         *   结果在完全正常的页面上也弹红框 —— 自己吓自己。 */
        var mounted = document.querySelector('.auth-box-wrap, input[type=password], .admin');
        if (!mounted) {
          errs.push('[timeout] 6 秒内没出现登录界面或后台主体（脚本可能没加载或没执行）');
          paint();
        }
      }, 6000);

      /* ★ 第二段体检：登录框**在 DOM 里但看不见**时，把关键样式/媒体查询状态报出来。
       *   只在确实异常时才弹（正常页面绝不误报）。 */
      window.setTimeout(function () {
        var box = document.querySelector('.auth-box-wrap') || document.querySelector('input[type=password]');
        if (!box) return;
        var el = box.closest('.auth-box-wrap') || box;
        var cs = getComputedStyle(el);
        var r = el.getBoundingClientRect();
        var vv = window.visualViewport;
        var bad = [];
        if (parseFloat(cs.opacity) < 0.9) bad.push('opacity=' + cs.opacity);
        if (cs.visibility !== 'visible') bad.push('visibility=' + cs.visibility);
        if (cs.display === 'none') bad.push('display=none');
        if (r.width < 20 || r.height < 20) bad.push('尺寸异常 ' + Math.round(r.width) + 'x' + Math.round(r.height));
        if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) {
          bad.push('跑到屏幕外 ' + Math.round(r.left) + ',' + Math.round(r.top));
        }
        if (matchMedia('(forced-colors: active)').matches) bad.push('系统高对比度已开启(forced-colors)');
        if (matchMedia('(prefers-contrast: more)').matches) bad.push('prefers-contrast: more');
        if (innerHeight < 200) bad.push('可视高度异常 ' + innerHeight);
        if (!bad.length) return;
        errs.push(
          '[inspect] 登录框在 DOM 里但可能看不见：' +
            bad.join(' | ') +
            '\n  参考：文字色=' + cs.color + ' 底色=' + cs.backgroundColor + ' z=' + cs.zIndex +
            ' 视口=' + innerWidth + 'x' + innerHeight + ' dpr=' + window.devicePixelRatio +
            ' vvScale=' + (vv ? vv.scale : '-') + ' 深色=' + matchMedia('(prefers-color-scheme: dark)').matches,
        );
        paint();
      }, 7000);
    })();
